<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>麻将AI陪练 - API 测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", monospace; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { color: #d4af37; margin-bottom: 20px; font-size: 1.4rem; }
    h2 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1200px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    button {
      padding: 8px 18px; background: #d4af37; color: #1a1a1a; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
      margin: 4px 4px 4px 0; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 1; }
    button.secondary { background: #334155; color: #cbd5e1; }
    .result {
      margin-top: 10px; background: #0f172a; border: 1px solid #1e3a5f;
      border-radius: 6px; padding: 12px; font-size: 0.78rem; line-height: 1.6;
      max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      color: #7dd3fc;
    }
    .result.error { color: #f87171; border-color: #7f1d1d; }
    .result.success { color: #86efac; border-color: #14532d; }
    .status-badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem;
      font-weight: bold; margin-left: 8px;
    }
    .badge-ok { background: #14532d; color: #86efac; }
    .badge-err { background: #7f1d1d; color: #f87171; }
    .badge-idle { background: #1e293b; color: #64748b; border: 1px solid #334155; }
    label { font-size: 0.82rem; color: #94a3b8; }
    input {
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; width: 100%; margin-top: 4px;
    }
    .row { display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 100px; }
    #game-display {
      background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 14px; margin-top: 10px; font-size: 0.82rem;
    }
    .hand-tiles { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    .tile {
      background: #fefce8; color: #1a1a1a; border: 1.5px solid #c8a94e;
      border-radius: 4px; padding: 4px 8px; font-size: 0.8rem; font-weight: bold; cursor: default;
    }
    .tile.playable { cursor: pointer; border-color: #f59e0b; background: #fffbeb; }
    .tile.playable:hover { background: #fef3c7; transform: translateY(-3px); }
    .tile.bamboo { color: #1a5e1a; }
    .tile.characters { color: #b91c1c; }
    .tile.dots { color: #1d4ed8; }
    .tile.special { color: #92400e; }
    .log-item { padding: 3px 0; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .log-item:first-child { color: #fde68a; font-weight: bold; }
    .act-btn {
      padding: 7px 18px; border: none; border-radius: 6px; cursor: pointer;
      font-weight: bold; font-size: 0.95rem; margin: 4px;
    }
    .act-pong { background: #e67e22; color: #fff; }
    .act-chow { background: #27ae60; color: #fff; }
    .act-gong { background: #8e44ad; color: #fff; }
    .act-stand { background: #7f8c8d; color: #fff; }
    .section-title { color: #64748b; font-size: 0.75rem; margin-bottom: 4px; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .full-width { grid-column: 1 / -1; }
    .info-bar { display: flex; gap: 20px; flex-wrap: wrap; padding: 8px 0; }
    .info-item label { display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 2px; }
    .info-item span { font-size: 0.9rem; color: #e2e8f0; font-weight: bold; }
  </style>
</head>
<body>

<h1>🀄 麻将AI陪练 — API 测试控制台</h1>
<p style="font-size:0.82rem; color:#64748b; margin-bottom:16px;">
  后端地址：<a href="http://localhost:8000" target="_blank">http://localhost:8000</a>
  &nbsp;|&nbsp;
  <a href="http://localhost:8000/docs" target="_blank">Swagger UI</a>
  &nbsp;|&nbsp;
  <a href="/" target="_blank">打开游戏界面 →</a>
</p>

<div class="grid">

  <!-- ① 启动游戏 -->
  <div class="card">
    <h2>① POST /api/start — 开始新游戏
      <span id="badge-start" class="status-badge badge-idle">未测试</span>
    </h2>
    <button onclick="doStart()">发起请求</button>
    <div id="result-start" class="result">等待请求…</div>
  </div>

  <!-- ② 获取状态 -->
  <div class="card">
    <h2>② GET /api/state/:id — 获取游戏状态
      <span id="badge-state" class="status-badge badge-idle">未测试</span>
    </h2>
    <div class="row">
      <div class="field">
        <label>Session ID</label>
        <input id="input-sid-state" placeholder="先执行①获取 session_id" />
      </div>
      <button onclick="doGetState()">发起请求</button>
    </div>
    <div id="result-state" class="result">等待请求…</div>
  </div>

  <!-- ③ 执行动作 -->
  <div class="card">
    <h2>③ POST /api/action/:id — 执行操作
      <span id="badge-action" class="status-badge badge-idle">未测试</span>
    </h2>
    <div class="row">
      <div class="field">
        <label>Session ID</label>
        <input id="input-sid-action" placeholder="先执行①" />
      </div>
      <div class="field" style="max-width:90px">
        <label>Action ID</label>
        <input id="input-action-id" type="number" placeholder="0-37" value="0" />
      </div>
      <button onclick="doAction()">发起请求</button>
    </div>
    <div id="result-action" class="result">等待请求…</div>
  </div>

  <!-- ④ 错误处理测试 -->
  <div class="card">
    <h2>④ 错误处理测试
      <span id="badge-err" class="status-badge badge-idle">未测试</span>
    </h2>
    <button onclick="testInvalidSession()">无效 Session</button>
    <button onclick="testInvalidAction()">非法 Action</button>
    <button class="secondary" onclick="testNotYourTurn()">非己回合操作</button>
    <div id="result-err" class="result">等待请求…</div>
  </div>

  <!-- ⑤ 游戏交互面板（完整流程测试） -->
  <div class="card full-width">
    <h2>⑤ 完整流程测试 — 交互式对局面板</h2>
    <div style="margin-bottom:10px; display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="startInteractive()">🆕 开始新局</button>
      <button class="secondary" onclick="autoPlay(5)">⏩ AI自动走5步</button>
      <button class="secondary" onclick="clearGameDisplay()">清除</button>
    </div>

    <div id="game-display">
      <p style="color:#475569;">点击「开始新局」载入游戏状态。</p>
    </div>
  </div>

</div>

<script>
const BASE = 'http://localhost:8000';
let activeSession = null;

// ── 工具 ────────────────────────────────────────
async function apiFetch(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(BASE + path, opts);
  const data = await res.json();
  return { ok: res.ok, status: res.status, data };
}

function show(id, content, type = '') {
  const el = document.getElementById(id);
  el.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
  el.className = `result ${type}`;
}

function setBadge(id, ok) {
  const el = document.getElementById(id);
  el.textContent = ok ? '✓ 通过' : '✗ 失败';
  el.className = `status-badge ${ok ? 'badge-ok' : 'badge-err'}`;
}

function syncSessionInputs(sid) {
  document.getElementById('input-sid-state').value = sid;
  document.getElementById('input-sid-action').value = sid;
}

// ── ① Start ──────────────────────────────────────
async function doStart() {
  try {
    const { ok, data } = await apiFetch('POST', '/api/start');
    show('result-start', data, ok ? 'success' : 'error');
    setBadge('badge-start', ok);
    if (ok) {
      activeSession = data.session_id;
      syncSessionInputs(data.session_id);
      // 预填第一个合法 action
      if (data.state.legal_actions?.length) {
        document.getElementById('input-action-id').value = data.state.legal_actions[0].id;
      }
    }
  } catch (e) {
    show('result-start', `请求失败: ${e.message}`, 'error');
    setBadge('badge-start', false);
  }
}

// ── ② Get State ──────────────────────────────────
async function doGetState() {
  const sid = document.getElementById('input-sid-state').value.trim();
  if (!sid) { show('result-state', '请先填写 Session ID', 'error'); return; }
  try {
    const { ok, data } = await apiFetch('GET', `/api/state/${sid}`);
    show('result-state', data, ok ? 'success' : 'error');
    setBadge('badge-state', ok);
  } catch (e) {
    show('result-state', `请求失败: ${e.message}`, 'error');
  }
}

// ── ③ Action ─────────────────────────────────────
async function doAction() {
  const sid = document.getElementById('input-sid-action').value.trim();
  const aid = parseInt(document.getElementById('input-action-id').value, 10);
  if (!sid) { show('result-action', '请先填写 Session ID', 'error'); return; }
  try {
    const { ok, data } = await apiFetch('POST', `/api/action/${sid}`, { action_id: aid });
    show('result-action', data, ok ? 'success' : 'error');
    setBadge('badge-action', ok);
    if (ok && data.legal_actions?.length) {
      document.getElementById('input-action-id').value = data.legal_actions[0].id;
    }
  } catch (e) {
    show('result-action', `请求失败: ${e.message}`, 'error');
  }
}

// ── ④ Error tests ────────────────────────────────
async function testInvalidSession() {
  const { ok, status, data } = await apiFetch('GET', '/api/state/invalid-session-xyz');
  const passed = !ok && status === 404;
  show('result-err', `[无效Session] HTTP ${status}\n${JSON.stringify(data, null, 2)}`, passed ? 'success' : 'error');
  setBadge('badge-err', passed);
}

async function testInvalidAction() {
  if (!activeSession) { show('result-err', '先运行①创建会话', 'error'); return; }
  const { ok, status, data } = await apiFetch('POST', `/api/action/${activeSession}`, { action_id: 999 });
  const passed = !ok && status === 400;
  show('result-err', `[非法Action 999] HTTP ${status}\n${JSON.stringify(data, null, 2)}`, passed ? 'success' : 'error');
  setBadge('badge-err', passed);
}

async function testNotYourTurn() {
  if (!activeSession) { show('result-err', '先运行①创建会话', 'error'); return; }
  // 试图在AI回合出牌（先检查是否轮到AI）
  const { ok: sok, data: sd } = await apiFetch('GET', `/api/state/${activeSession}`);
  if (!sok) { show('result-err', '获取状态失败', 'error'); return; }
  if (sd.is_human_turn) {
    show('result-err', '当前轮到玩家，无法测试"非己回合"场景（请先出几张牌）', '');
    return;
  }
  const { ok, status, data } = await apiFetch('POST', `/api/action/${activeSession}`, { action_id: 0 });
  const passed = !ok && status === 400;
  show('result-err', `[非己回合] HTTP ${status}\n${JSON.stringify(data, null, 2)}`, passed ? 'success' : 'error');
  setBadge('badge-err', passed);
}

// ── ⑤ Interactive Panel ──────────────────────────
const TILE_SUIT_CN = {};
['bamboo','characters','dots'].forEach(s => {
  for (let i=1;i<=9;i++) TILE_SUIT_CN[`${s}-${i}`] = {num:`${i}`, suit:s === 'bamboo' ? '竹' : s === 'characters' ? '万' : '筒', cls: s};
});
['dragons-green','dragons-red','dragons-white','winds-east','winds-south','winds-west','winds-north'].forEach(k => {
  const cn = {
    'dragons-green':'發','dragons-red':'中','dragons-white':'白',
    'winds-east':'东','winds-south':'南','winds-west':'西','winds-north':'北'
  }[k];
  TILE_SUIT_CN[k] = { num: cn, suit: '', cls: 'special' };
});

function tileEl(name, playable, actionId, cb) {
  const info = TILE_SUIT_CN[name] || { num: name, suit: '', cls: '' };
  const div = document.createElement('span');
  div.className = `tile ${info.cls}${playable ? ' playable' : ''}`;
  div.title = name;
  div.innerHTML = `${info.num}<sup style="font-size:0.55em;opacity:0.7">${info.suit}</sup>`;
  if (playable && cb) div.onclick = () => cb(actionId);
  return div;
}

function renderGameDisplay(state, sid) {
  const d = document.getElementById('game-display');
  if (!state || state.done) {
    const winner = state?.winner;
    d.innerHTML = `<p style="color:#fde68a;font-size:1.1rem;">
      ${winner === 0 ? '🎉 你赢了！' : winner > 0 ? `😔 玩家${winner}(AI)赢了` : '🤝 流局'}
    </p>`;
    return;
  }

  const legalNames = new Set((state.legal_actions || []).map(a => a.name));
  const legalMap = {};
  (state.legal_actions || []).forEach(a => legalMap[a.name] = a.id);

  const isPlay = state.valid_acts?.includes('play');
  const isReact = state.valid_acts?.some(v => ['pong','chow','gong','stand'].includes(v));

  async function sendAct(id) {
    const { ok, data } = await apiFetch('POST', `/api/action/${sid}`, { action_id: id });
    if (ok) renderGameDisplay(data, sid);
    else alert(data.detail || '操作失败');
  }

  d.innerHTML = `
    <div class="info-bar">
      <div class="info-item"><label>Session</label><span>${sid}</span></div>
      <div class="info-item"><label>当前玩家</label><span>${state.current_player}</span></div>
      <div class="info-item"><label>轮到你</label><span>${state.is_human_turn ? '✅ 是' : '⏳ 否'}</span></div>
      <div class="info-item"><label>操作类型</label><span>${(state.valid_acts||[]).join('/')}</span></div>
    </div>
  `;

  // 对手手牌数
  const opp = document.createElement('div');
  opp.innerHTML = `<div class="section-title">对手手牌数</div>`;
  const oppRow = document.createElement('div');
  oppRow.style.cssText = 'display:flex;gap:16px;margin-bottom:8px;';
  [1,2,3].forEach(i => {
    const info = state.players_info[i];
    const span = document.createElement('span');
    span.innerHTML = `<span style="color:#94a3b8">玩家${i}:</span> <b>${info.hand_count}</b> 张`;
    span.style.fontSize = '0.82rem';
    oppRow.appendChild(span);
  });
  opp.appendChild(oppRow);
  d.appendChild(opp);

  // 弃牌堆
  if (state.table.length > 0) {
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="section-title">桌面弃牌 (${state.table.length}张)</div>`;
    const row = document.createElement('div');
    row.className = 'hand-tiles';
    state.table.slice(-12).forEach(name => row.appendChild(tileEl(name, false)));
    if (state.table.length > 12) row.insertAdjacentHTML('beforeend', `<span style="color:#64748b;font-size:0.75rem">…等${state.table.length}张</span>`);
    sec.appendChild(row);
    d.appendChild(sec);
  }

  // 你的手牌
  const handSec = document.createElement('div');
  handSec.innerHTML = `<div class="section-title">你的手牌 (${state.human_hand.length}张)${isPlay ? ' — 点击出牌' : ''}</div>`;
  const handRow = document.createElement('div');
  handRow.className = 'hand-tiles';
  state.human_hand.forEach(name => {
    handRow.appendChild(tileEl(name, isPlay && legalNames.has(name), legalMap[name], sendAct));
  });
  handSec.appendChild(handRow);
  d.appendChild(handSec);

  // 反应按钮
  if (isReact && state.is_human_turn) {
    const btnSec = document.createElement('div');
    btnSec.innerHTML = `<div class="section-title">操作选择</div>`;
    state.legal_actions.forEach(act => {
      const btn = document.createElement('button');
      const cn = {pong:'碰',chow:'吃',gong:'杠',stand:'不要'}[act.name] || act.name;
      btn.className = `act-btn act-${act.name}`;
      btn.textContent = cn;
      btn.onclick = () => sendAct(act.id);
      btnSec.appendChild(btn);
    });
    d.appendChild(btnSec);
  }

  // 日志
  const logSec = document.createElement('div');
  logSec.innerHTML = `<div class="section-title" style="margin-top:8px">操作记录</div>`;
  const logDiv = document.createElement('div');
  [...state.log].reverse().slice(0, 8).forEach(msg => {
    const item = document.createElement('div');
    item.className = 'log-item';
    item.textContent = msg;
    logDiv.appendChild(item);
  });
  logSec.appendChild(logDiv);
  d.appendChild(logSec);
}

async function startInteractive() {
  const { ok, data } = await apiFetch('POST', '/api/start');
  if (!ok) { alert('启动失败'); return; }
  activeSession = data.session_id;
  syncSessionInputs(data.session_id);
  renderGameDisplay(data.state, data.session_id);
}

async function autoPlay(steps) {
  if (!activeSession) { alert('先点击「开始新局」'); return; }
  for (let i = 0; i < steps; i++) {
    const { ok: sok, data: sd } = await apiFetch('GET', `/api/state/${activeSession}`);
    if (!sok || sd.done) { renderGameDisplay(sd, activeSession); return; }
    if (!sd.is_human_turn) { await new Promise(r => setTimeout(r, 50)); continue; }
    if (!sd.legal_actions?.length) break;
    const act = sd.legal_actions[Math.floor(Math.random() * sd.legal_actions.length)];
    const { ok, data } = await apiFetch('POST', `/api/action/${activeSession}`, { action_id: act.id });
    renderGameDisplay(data, activeSession);
    if (!ok || data.done) return;
    await new Promise(r => setTimeout(r, 200));
  }
}

function clearGameDisplay() {
  document.getElementById('game-display').innerHTML = '<p style="color:#475569;">已清除。</p>';
}
</script>
</body>
</html>
